<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEGAME</title>
    <link rel="shortcut icon" href="./image.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<style>
  body {
  background: black;
}
.navbar{
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .navbar-brand{
      color: #00f5ff !important;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      transition: 0.3s;
    }

    .navbar-brand:hover{
      transform: scale(1.05);
      color: white !important;
      text-shadow: 0 0 10px #00f5ff;
    }

    .nav-link{
      color: white !important;
      margin: 0 10px;
      font-size: 18px;
      position: relative;
      transition: 0.3s;
    }

    .nav-link::after{
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 0%;
      height: 2px;
      background: #00f5ff;
      transition: 0.3s;
    }

    .nav-link:hover::after{
      width: 100%;
    }

    .nav-link:hover{
      color: #00f5ff !important;
      transform: translateY(-2px);
    }

    /* BUTTONS */

    .custom-btn{
      border: 2px solid #00f5ff;
      color: white;
      padding: 8px 18px;
      border-radius: 30px;
      text-decoration: none;
      transition: 0.4s;
      margin-left: 10px;
      font-weight: bold;
    }

    .custom-btn:hover{
      background: #00f5ff;
      color: black;
      box-shadow: 0 0 15px #00f5ff;
    }

    /* MOBILE */

    .navbar-toggler{
      border: none;
      outline: none;
      box-shadow: none !important;
    }

    .navbar-toggler-icon{
      filter: invert(1);
    }

    @media(max-width: 991px){

      .navbar-collapse{
        background: #111827;
        padding: 20px;
        border-radius: 15px;
        margin-top: 15px;
        text-align: center;
      }

      .nav-link{
        margin: 15px 0;
      }

      .button-group{
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-top: 15px;
      }

      .custom-btn{
        margin-left: 0;
      }

    }


.stars {
  width: 100%;
  height: 100%;
  background: url('https://www.transparenttextures.com/patterns/stardust.png');
  animation: moveStars 50s linear infinite;
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}

@keyframes moveStars {
  from { background-position: 0 0; }
  to { background-position: 1000px 1000px; }
}
form{
   width: 250px;
   border-radius: 5px;
   background-color: rgb(37, 26, 26);
   color: white;
}
H1{
font-size: 70px;
  text-shadow: 30px;
  color: rgb(103, 9, 98);
}
 .login-card{

      width:100%;
      max-width:420px;

      background:rgba(255,255,255,0.06);

      border:1px solid rgba(255,255,255,0.1);

      backdrop-filter:blur(14px);

      border-radius:25px;

      padding:40px 35px;

      box-shadow:
      0 0 30px rgba(0,255,255,0.15);

      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .logo{
      text-align:center;
      margin-bottom:15px;
    }

    .logo i{
      font-size:60px;
      color:#00ffff;
      text-shadow:
      0 0 10px #00ffff,
      0 0 25px #00ffff;
    }

    .title{
      text-align:center;
      color:white;
      font-size:32px;
      font-weight:bold;
      margin-bottom:8px;
    }

    .subtitle{
      text-align:center;
      color:#94a3b8;
      margin-bottom:30px;
      font-size:15px;
    }

    /* Input Fields */

    .form-label{
      color:#e2e8f0;
      margin-bottom:8px;
      font-weight:500;
    }

    .input-group{
      margin-bottom:20px;
    }

    .input-group-text{
      background:#111827;
      border:none;
      color:#00ffff;
      border-radius:12px 0 0 12px;
    }

    .form-control{

      background:#1e293b;
      border:none;
      color:white;
      height:50px;
      border-radius:0 12px 12px 0;
    }

    .form-control:focus{
      background:#1e293b;
      color:white;
      box-shadow:
      0 0 12px rgba(0,255,255,0.5);
      border:none;
    }

    .form-check-label{
      color:#cbd5e1;
    }

    /* Buttons */

    .login-btn{

      width:100%;
      height:50px;

      border:none;

      border-radius:14px;

      background:linear-gradient(
        90deg,
        #06b6d4,
        #3b82f6
      );

      color:white;

      font-size:18px;

      font-weight:bold;

      transition:0.3s;
    }

    .login-btn:hover{

      transform:translateY(-3px);

      box-shadow:
      0 0 20px rgba(0,255,255,0.5);
    }

    .register-link{

      display:block;

      text-align:center;

      margin-top:20px;

      text-decoration:none;

      color:#00ffff;

      font-weight:bold;

      transition:0.3s;
    }

    .register-link:hover{
      color:white;
      letter-spacing:1px;
    }

    #msg{
      text-align:center;
      margin-top:15px;
      color:#00ff99;
      font-weight:bold;
    }

    /* Mobile */

    @media(max-width:500px){

      .login-card{
        margin:20px;
        padding:30px 25px;
      }

      .title{
        font-size:26px;
      }

    }

</style>

    <div class="container-fluid">

      <a class="navbar-brand" href="#">
        ᑕOᗪEGᗩᗰE
      </a>

      <button class="navbar-toggler" 
              type="button" 
              data-bs-toggle="collapse" 
              data-bs-target="#navbarContent">

        <span class="navbar-toggler-icon"></span>

      </button>

      <div class="collapse navbar-collapse" id="navbarContent">

        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link active" href="#">HOME</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">CHALLENGES</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">LEADERBOARD</a>
          </li>

<div class="stars"></div>
<body>
<center>

  <div class="login-card">

    <div class="logo">
      <i class="fa-solid fa-gamepad"></i>
    </div>

    <h1 class="title">CODEGAME</h1>

    <p class="subtitle">
      Login and continue your coding journey 🚀
    </p>

    <form id="form">

      <!-- Email -->

      <label class="form-label">
        Email Address
      </label>

      <div class="input-group">

        <span class="input-group-text">
          <i class="fa-solid fa-envelope"></i>
        </span>

        <input 
          type="email"
          class="form-control"
          id="Email1"
          placeholder="Enter your email"
          required
        >

      </div>

      <!-- Password -->

      <label class="form-label">
        Password
      </label>

      <div class="input-group">

        <span class="input-group-text">
          <i class="fa-solid fa-lock"></i>
        </span>

        <input 
          type="password"
          class="form-control"
          id="Password1"
          placeholder="Enter your password"
          required
        >

      </div>

      <!-- Remember -->

      <div class="form-check mb-4">

        <input 
          type="checkbox"
          class="form-check-input"
          id="Check1"
        >

        <label class="form-check-label">
          Remember Me
        </label>

      </div>

      <!-- Button -->

      <button type="submit" class="login-btn">
        LOGIN
      </button>

      <!-- Register -->

      <a href="./register.html" class="register-link">
        Create New Account
      </a>

      <p id="msg"></p>

    </form>

</center>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">
</script>
<script>

let myform = document.getElementById("form")
let output = document.getElementById("msg")

myform.onsubmit = async function(e){

    e.preventDefault()

    let email = document.getElementById("Email1").value
    let password = document.getElementById("Password1").value

    let user = {

        email: email,
        password: password

    }

    try{

        let response = await fetch("http://localhost:8081/api/user/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body: JSON.stringify(user)

        })

        let data = await response.text()

        if(data === "Login Success"){

            output.innerText = data
            output.style.color = "green"

            setTimeout(() => {

                window.location.href = "web.html"

            },2000)

        }

        else{

            output.innerText = data
            output.style.color = "red"

        }

    }

    catch(error){

        output.innerText = "Server Error"
        output.style.color = "red"

    }

}

</script>


</html>
