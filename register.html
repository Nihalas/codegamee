<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEGAME</title>
    <link rel="shortcut icon" href="./image.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<style>
  body {
  background: black;

}
.navbar{
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .navbar-brand{
      color: #00f5ff !important;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      transition: 0.3s;
    }

    .navbar-brand:hover{
      transform: scale(1.05);
      color: white !important;
      text-shadow: 0 0 10px #00f5ff;
    }

    .nav-link{
      color: white !important;
      margin: 0 10px;
      font-size: 18px;
      position: relative;
      transition: 0.3s;
    }

    .nav-link::after{
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 0%;
      height: 2px;
      background: #00f5ff;
      transition: 0.3s;
    }

    .nav-link:hover::after{
      width: 100%;
    }

    .nav-link:hover{
      color: #00f5ff !important;
      transform: translateY(-2px);
    }

    /* BUTTONS */

    .custom-btn{
      border: 2px solid #00f5ff;
      color: white;
      padding: 8px 18px;
      border-radius: 30px;
      text-decoration: none;
      transition: 0.4s;
      margin-left: 10px;
      font-weight: bold;
    }

    .custom-btn:hover{
      background: #00f5ff;
      color: black;
      box-shadow: 0 0 15px #00f5ff;
    }

    /* MOBILE */

    .navbar-toggler{
      border: none;
      outline: none;
      box-shadow: none !important;
    }

    .navbar-toggler-icon{
      filter: invert(1);
    }

    @media(max-width: 991px){

      .navbar-collapse{
        background: #111827;
        padding: 20px;
        border-radius: 15px;
        margin-top: 15px;
        text-align: center;
      }

      .nav-link{
        margin: 15px 0;
      }

      .button-group{
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-top: 15px;
      }

      .custom-btn{
        margin-left: 0;
      }

    }
    
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      background:
      linear-gradient(
        135deg,
        #020617,
        #0f172a,
        #111827
      );

      overflow:hidden;
      position:relative;
    }

    /* Background */

    .stars{

      position:absolute;

      width:100%;
      height:100%;

      background:url('https://www.transparenttextures.com/patterns/stardust.png');

      animation:moveStars 50s linear infinite;

      z-index:-1;
    }

    @keyframes moveStars{

      from{
        background-position:0 0;
      }

      to{
        background-position:1000px 1000px;
      }

    }

    /* Register Card */

    .register-card{

      width:100%;
      max-width:450px;

      background:rgba(255,255,255,0.06);

      border:1px solid rgba(255,255,255,0.1);

      backdrop-filter:blur(14px);

      border-radius:25px;

      padding:40px 35px;

      box-shadow:
      0 0 30px rgba(0,255,255,0.15);

      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    .logo{
      text-align:center;
      margin-bottom:15px;
    }

    .logo i{

      font-size:60px;

      color:#00ffff;

      text-shadow:
      0 0 10px #00ffff,
      0 0 25px #00ffff;
    }

    .title{

      text-align:center;

      color:white;

      font-size:34px;

      font-weight:bold;

      margin-bottom:8px;
    }

    .subtitle{

      text-align:center;

      color:#94a3b8;

      margin-bottom:30px;

      font-size:15px;
    }

    /* Inputs */

    .form-label{
      color:#e2e8f0;
      margin-bottom:8px;
      font-weight:500;
    }

    .input-group{
      margin-bottom:20px;
    }

    .input-group-text{

      background:#111827;

      border:none;

      color:#00ffff;

      border-radius:12px 0 0 12px;
    }

    .form-control{

      background:#1e293b;

      border:none;

      color:white;

      height:52px;

      border-radius:0 12px 12px 0;
    }

    .form-control:focus{

      background:#1e293b;

      color:white;

      border:none;

      box-shadow:
      0 0 12px rgba(0,255,255,0.5);
    }

    /* Button */

    .register-btn{

      width:100%;
      height:52px;

      border:none;

      border-radius:14px;

      background:
      linear-gradient(
        90deg,
        #06b6d4,
        #3b82f6
      );

      color:white;

      font-size:18px;

      font-weight:bold;

      transition:0.3s;
    }

    .register-btn:hover{

      transform:translateY(-3px);

      box-shadow:
      0 0 20px rgba(0,255,255,0.5);
    }

    /* Login Link */

    .login-link{

      display:block;

      text-align:center;

      margin-top:20px;

      text-decoration:none;

      color:#00ffff;

      font-weight:bold;

      transition:0.3s;
    }

    .login-link:hover{
      color:white;
      letter-spacing:1px;
    }

    #msg{

      text-align:center;

      margin-top:20px;

      font-weight:bold;

      color:#00ff99;
    }

    /* Mobile */

    @media(max-width:500px){

      .register-card{
        margin:20px;
        padding:30px 25px;
      }

      .title{
        font-size:28px;
      }

    }




    </style>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container-fluid">

      <a class="navbar-brand" href="#">
        ᑕOᗪEGᗩᗰE
      </a>

      <button class="navbar-toggler" 
              type="button" 
              data-bs-toggle="collapse" 
              data-bs-target="#navbarContent">

        <span class="navbar-toggler-icon"></span>

      </button>

      <div class="collapse navbar-collapse" id="navbarContent">

        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link active" href="#">HOME</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">CHALLENGES</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">LEADERBOARD</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">ABOUTUS</a>
          </li>

        </ul>

      
      </div>

    </div>

  </nav>

 
<br>  
<div class="stars"></div>
<body>
 
 <div class="register-card">

    <div class="logo">
      <i class="fa-solid fa-user-plus"></i>
    </div>

    <h1 class="title">
      STEP INTO FUTURE!
    </h1>

    <p class="subtitle">
      Create your CODEGAME account and start coding 🚀
    </p>

    <form id="myform">

      <!-- Username -->

      <label class="form-label">
        Username
      </label>

      <div class="input-group">

        <span class="input-group-text">
          <i class="fa-solid fa-user"></i>
        </span>

        <input 
          type="text"
          class="form-control"
          id="user"
          placeholder="Enter your username"
          required
        >

      </div>

      <!-- Password -->

      <label class="form-label">
        Password
      </label>

      <div class="input-group">

        <span class="input-group-text">
          <i class="fa-solid fa-lock"></i>
        </span>

        <input 
          type="password"
          class="form-control"
          id="pass"
          placeholder="Create strong password"
          required
        >

      </div>

      <!-- Email -->

      <label class="form-label">
        Email Address
      </label>

      <div class="input-group">

        <span class="input-group-text">
          <i class="fa-solid fa-envelope"></i>
        </span>

        <input 
          type="email"
          class="form-control"
          id="email"
          placeholder="Enter your email"
          required
        >

      </div>

      <!-- Button -->

      <button type="submit" class="register-btn">
        CREATE ACCOUNT
      </button>

      <!-- Login -->

      <a href="./login.html" class="login-link">
        Already have an account? Login
      </a>

      <h5 id="msg"></h5>

    </form>

  </div>

    
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script>

let myform = document.getElementById("myform")
let output = document.getElementById("msg")

myform.onsubmit = async function(e){

    e.preventDefault()

    let username = document.getElementById("user").value
    let password = document.getElementById("pass").value
    let email = document.getElementById("email").value

    if(username == "" || password == "" || email == ""){
        output.innerText = "Please fill all fields"
        output.style.color = "red"
        return
    }

    let users = {
        name: username,
        password: password,
        email: email
    }

    try{

        let response = await fetch("http://localhost:8081/api/user/register", {

            method: "POST",

            headers:{
                "Content-Type":"application/json"
            },

            body: JSON.stringify(users)

        })

        let data = await response.json()

        output.innerText = "Register Success"
        output.style.color = "green"

        setTimeout(() => {
            window.location.href = "login.html"
        }, 2000)

    }

    catch(error){

        output.innerText = "Something went wrong"
        output.style.color = "red"

    }

}

</script>
    

</html>
