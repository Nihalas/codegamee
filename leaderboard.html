<style>
  body {
  background: black;
}
.navbar{
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .navbar-brand{
      color: #00f5ff !important;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      transition: 0.3s;
    }

    .navbar-brand:hover{
      transform: scale(1.05);
      color: white !important;
      text-shadow: 0 0 10px #00f5ff;
    }

    .nav-link{
      color: white !important;
      margin: 0 10px;
      font-size: 18px;
      position: relative;
      transition: 0.3s;
    }

    .nav-link::after{
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 0%;
      height: 2px;
      background: #00f5ff;
      transition: 0.3s;
    }

    .nav-link:hover::after{
      width: 100%;
    }

    .nav-link:hover{
      color: #00f5ff !important;
      transform: translateY(-2px);
    }

    /* BUTTONS */

    .custom-btn{
      border: 2px solid #00f5ff;
      color: white;
      padding: 8px 18px;
      border-radius: 30px;
      text-decoration: none;
      transition: 0.4s;
      margin-left: 10px;
      font-weight: bold;
    }

    .custom-btn:hover{
      background: #00f5ff;
      color: black;
      box-shadow: 0 0 15px #00f5ff;
    }

    /* MOBILE */

    .navbar-toggler{
      border: none;
      outline: none;
      box-shadow: none !important;
    }

    .navbar-toggler-icon{
      filter: invert(1);
    }

    @media(max-width: 991px){

      .navbar-collapse{
        background: #111827;
        padding: 20px;
        border-radius: 15px;
        margin-top: 15px;
        text-align: center;
      }

      .nav-link{
        margin: 15px 0;
      }

      .button-group{
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-top: 15px;
      }

      .custom-btn{
        margin-left: 0;
      }

    }


.stars {
  width: 100%;
  height: 100%;
  background: url('https://www.transparenttextures.com/patterns/stardust.png');
  animation: moveStars 50s linear infinite;
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}

@keyframes moveStars {
  from { background-position: 0 0; }
  to { background-position: 1000px 1000px; }
}
form{
   width: 250px;
   border-radius: 5px;
   background-color: rgb(37, 26, 26);

}
H1{
font-size: 70px;

.header{

      text-align:center;

      padding:80px 20px 50px;
    }

    .header h1{

        0 0 10px #00ffff,

    }

    .header p{

      margin-top:20px;

    }

    /* =========================

    ========================== */

    .top-players{

    }

    .top-card{

      background:rgba(10, 243, 61, 0.712);

      border:1px solid rgba(17, 199, 99, 0.822);

      border-radius:25px;

      padding:40px 20px;

      text-align:center;

      backdrop-filter:blur(10px);

      transition:0.3s;
    }

    .top-card:hover{

      transform:translateY(-10px);

      box-shadow:
        0 0 20px rgba(0,255,255,0.3);
    }

    .top-card i{

    .gold{

    }

    .silver{

    }

    .bronze{

    }

    .top-card h3{
      margin-bottom:10px;
    }

    .top-card p{
      color:#cbd5e1;
    }

    /* =========================
       Leaderboard Table
    ========================== */

    .leaderboard-section{
      padding:80px 20px;
    }

    .leaderboard-card{

      background:rgba(255,255,255,0.05);

      border:1px solid rgba(255,255,255,0.08);

      border-radius:20px;

      padding:30px;

      backdrop-filter:blur(10px);
    }

    table{
      color:white !important;
    }

    thead{
      color:#00ffff;
    }

    tbody tr{
      transition:0.3s;
    }

    tbody tr:hover{
      background:rgba(0,255,255,0.08);
    }

    .rank{
      font-weight:bold;
      color:#00ffff;
    }

    .xp{

    /* =========================
       Footer
    ========================== */

    footer{

      padding:30px;

      border-top:1px solid rgba(255,255,255,0.08);

      color:#94a3b8;
    }

    /* =========================
       Responsive
    ========================== */

    @media(max-width:768px){

      .header h1{
        font-size:45px;
      }

    }

</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">

<script>

async function loadLeaderboard() {

    let response = await fetch("http://localhost:8080/leaderboard");

    let data = await response.json();

    // TABLE
    let leaderboardBody = document.getElementById("leaderboard-body");

    if(leaderboardBody){

        leaderboardBody.innerHTML = "";

        data.forEach((user, index) => {

            leaderboardBody.innerHTML += `

            <tr>

                <td class="rank">#${index + 1}</td>

                <td>${user.username}</td>

                <td class="xp">${user.xp} XP</td>

                <td>${user.level}</td>

                <td>${user.solved}</td>

            </tr>

            `;

        });

    }
  let topPlayers = document.getElementById("topPlayers");

topPlayers.innerHTML = "";

let medals = [

    "🥇",
    "🥈",
    "🥉"

];

for(let i = 0; i < 3; i++) {

    topPlayers.innerHTML += `

    <div class="col-md-3">

        <div class="top-card">

            <h1>${medals[i]}</h1>

            <h3>${data[i].username}</h3>

            <p>${data[i].xp} XP</p>

            <p>Level ${data[i].level}</p>

            <p>${data[i].solved} Solved</p>

        </div>

    </div>

    `;

}
}

loadLeaderboard();


</script>
