<style>
  body {
  background: black;
}
.navbar{
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .navbar-brand{
      color: #00f5ff !important;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      transition: 0.3s;
    }

    .navbar-brand:hover{
      transform: scale(1.05);
      color: white !important;
      text-shadow: 0 0 10px #00f5ff;
    }

    .nav-link{
      color: white !important;
      margin: 0 10px;
      font-size: 18px;
      position: relative;
      transition: 0.3s;
    }

    .nav-link::after{
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 0%;
      height: 2px;
      background: #00f5ff;
      transition: 0.3s;
    }

    .nav-link:hover::after{
      width: 100%;
    }

    .nav-link:hover{
      color: #00f5ff !important;
      transform: translateY(-2px);
    }
    .stars {
  width: 100%;
  height: 100%;
  background: url('https://www.transparenttextures.com/patterns/stardust.png');
  animation: moveStars 50s linear infinite;
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}

@keyframes moveStars {
  from { background-position: 0 0; }
  to { background-position: 1000px 1000px; }
}
h1{
    color: #fdfcfc;
}


</style>
